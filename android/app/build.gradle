plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('UW_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('UW_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('UW_KEY_ALIAS')
def releaseKeyPassword = System.getenv('UW_KEY_PASSWORD')

android {
    namespace 'com.urbanwarriors.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.urbanwarriors.app'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '1.6.0'
    }

    signingConfigs {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('Urban Warriors: google-services.json no está presente; se compilará sin registrar FCM hasta añadirlo.')
}
