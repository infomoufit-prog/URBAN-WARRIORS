name: Validate Netlify R118 20177 F

on:
  push:
    branches:
      - validate-netlify-20177-f

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: 7d024e64df90b8b05f7ed3f3f973649f993a9637
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Netlify build command
        run: npm run release:build
