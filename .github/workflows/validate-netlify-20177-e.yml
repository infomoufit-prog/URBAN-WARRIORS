name: Validate Netlify R118 20177 E

on:
  push:
    branches:
      - validate-netlify-20177-e

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: f9b9642952a879c838b69c52a516d653e90ca56d
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Netlify build command
        run: npm run release:build
