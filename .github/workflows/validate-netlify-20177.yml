name: Validate Netlify R118 20177

on:
  push:
    branches:
      - validate-netlify-20177

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: c86cf12c70fb790825495025e001df5516b50a99
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run exact Netlify build command
        run: npm run release:build
