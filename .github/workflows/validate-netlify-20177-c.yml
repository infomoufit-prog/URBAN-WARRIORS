name: Validate Netlify R118 20177 C

on:
  push:
    branches:
      - validate-netlify-20177-c

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: 28f90c9c97998f78384c4b507cd974f7cf236d45
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Netlify build command
        run: npm run release:build
