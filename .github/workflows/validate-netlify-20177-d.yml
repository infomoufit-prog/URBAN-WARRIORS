name: Validate Netlify R118 20177 D

on:
  push:
    branches:
      - validate-netlify-20177-d

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: b47187a9abd2d6916d868315976545264aa581e9
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Netlify build command
        run: npm run release:build
