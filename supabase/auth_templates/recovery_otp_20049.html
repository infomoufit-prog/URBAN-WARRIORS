<!doctype html>
<html lang="es">
  <body style="margin:0;background:#08090b;color:#f7f7f5;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:34px 24px">
      <div style="font-size:13px;letter-spacing:.18em;color:#e21d2d;font-weight:700">KOMBAX</div>
      <h1 style="font-size:25px;margin:12px 0">Cambiar tu contraseña</h1>
      <p style="color:#c9cbd0;line-height:1.6">Hemos recibido una solicitud para cambiar la contraseña de tu cuenta.</p>
      <p style="color:#c9cbd0;line-height:1.6">Introduce este código de verificación en KOMBAX:</p>
      <div style="margin:24px 0;padding:18px;text-align:center;border:1px solid #34363b;border-radius:14px;background:#111318;font-size:34px;font-weight:800;letter-spacing:.22em">{{ .Token }}</div>
      <p style="color:#9da0a8;font-size:13px;line-height:1.6">El código es de un solo uso y caduca. Si no has solicitado este cambio, ignora este correo y no compartas el código con nadie.</p>
    </div>
  </body>
</html>
