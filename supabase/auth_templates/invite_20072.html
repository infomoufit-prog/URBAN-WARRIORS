<!doctype html>
<html lang="es">
  <body style="margin:0;background:#08090b;color:#f7f7f5;font-family:Arial,Helvetica,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:34px 24px">
      <div style="font-size:13px;letter-spacing:.18em;color:#e21d2d;font-weight:700">KOMBAX</div>
      <h1 style="font-size:25px;margin:12px 0">Tienes una invitación</h1>
      <p style="color:#c9cbd0;line-height:1.6">Has recibido una invitación para acceder a KOMBAX. Comprueba que reconoces la invitación antes de continuar.</p>
      <p style="margin:26px 0">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e21d2d;color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:10px">Aceptar invitación</a>
      </p>
      <p style="color:#9da0a8;font-size:13px;line-height:1.6">Si no esperabas esta invitación, ignora el mensaje. No compartas el enlace de acceso con otras personas.</p>
    </div>
